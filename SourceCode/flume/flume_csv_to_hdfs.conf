# ==============================================================================
# KỊCH BẢN 1: NẠP TỆP CSV THEO LÔ VÀO HDFS (SPOOLING DIRECTORY SOURCE -> FILE CHANNEL -> HDFS SINK)
# Mục đích: Đọc các file CSV định kỳ được đổ vào thư mục spoolDir và ghi vào vùng lưu trữ HDFS
# ==============================================================================

# Định nghĩa tên Agent và các thành phần
csvAgent.sources = src_spool_csv
csvAgent.channels = ch_file_csv
csvAgent.sinks = snk_hdfs_csv

# ------------------------------------------------------------------------------
# 1. CẤU HÌNH SOURCE (Spooling Directory Source)
# ------------------------------------------------------------------------------
csvAgent.sources.src_spool_csv.type = spooldir
# Đường dẫn thư mục cục bộ theo dõi tệp CSV mới
csvAgent.sources.src_spool_csv.spoolDir = /var/log/telecom/batch_csv
# Đổi đuôi tệp sau khi đã đọc xong để tránh nạp trùng lặp
csvAgent.sources.src_spool_csv.fileSuffix = .COMPLETED
# Xử lý khi có file trùng tên hoặc ghi đè
csvAgent.sources.src_spool_csv.deletePolicy = immediate
# Đọc theo từng dòng (Line-by-line)
csvAgent.sources.src_spool_csv.deserializer = LINE
csvAgent.sources.src_spool_csv.deserializer.maxLineLength = 4096
# Gắn thêm timestamp header vào event phục vụ phân vùng HDFS
csvAgent.sources.src_spool_csv.interceptors = it_ts it_static
csvAgent.sources.src_spool_csv.interceptors.it_ts.type = timestamp
csvAgent.sources.src_spool_csv.interceptors.it_static.type = static
csvAgent.sources.src_spool_csv.interceptors.it_static.key = source_type
csvAgent.sources.src_spool_csv.interceptors.it_static.value = batch_kpi_csv

# ------------------------------------------------------------------------------
# 2. CẤU HÌNH CHANNEL (FileChannel - Đảm bảo chống mất dữ liệu khi mất điện/crash)
# ------------------------------------------------------------------------------
csvAgent.channels.ch_file_csv.type = file
# Thư mục lưu trữ checkpoint của FileChannel
csvAgent.channels.ch_file_csv.checkpointDir = /var/flume/checkpoint/csv_channel
# Thư mục lưu Write-Ahead Log (WAL) chứa dữ liệu event
csvAgent.channels.ch_file_csv.dataDirs = /var/flume/data/csv_channel
# Sức chứa tối đa của channel (số event)
csvAgent.channels.ch_file_csv.capacity = 1000000
# Số event tối đa trong 1 transaction commit
csvAgent.channels.ch_file_csv.transactionCapacity = 10000
# Thời gian chờ checkpoint
csvAgent.channels.ch_file_csv.checkpointInterval = 30000

# ------------------------------------------------------------------------------
# 3. CẤU HÌNH SINK (HDFS Sink - Ghi phân vùng vào HDFS Raw Zone)
# ------------------------------------------------------------------------------
csvAgent.sinks.snk_hdfs_csv.type = hdfs
# Đường dẫn phân vùng theo năm/tháng/ngày dựa trên timestamp interceptor
csvAgent.sinks.snk_hdfs_csv.hdfs.path = hdfs://masternode:9000/telecom/raw/batch_kpi/%Y/%m/%d
# Tiền tố và hậu tố tệp trên HDFS
csvAgent.sinks.snk_hdfs_csv.hdfs.filePrefix = telecom_kpi_batch
csvAgent.sinks.snk_hdfs_csv.hdfs.fileSuffix = .csv
# Định dạng lưu trữ: DataStream để giữ nguyên bản ghi văn bản CSV
csvAgent.sinks.snk_hdfs_csv.hdfs.fileType = DataStream
csvAgent.sinks.snk_hdfs_csv.hdfs.writeFormat = Text
# Quy tắc Roll file (tạo file mới trên HDFS):
# - Roll theo thời gian: 300 giây (5 phút)
csvAgent.sinks.snk_hdfs_csv.hdfs.rollInterval = 300
# - Roll theo kích thước: 128 MB (tương ứng với 1 HDFS Block size lý tưởng)
csvAgent.sinks.snk_hdfs_csv.hdfs.rollSize = 134217728
# - Roll theo số lượng event (0 = vô hiệu hóa điều kiện đếm số dòng)
csvAgent.sinks.snk_hdfs_csv.hdfs.rollCount = 0
# Số event flush vào HDFS trong một đợt (Batch size)
csvAgent.sinks.snk_hdfs_csv.hdfs.batchSize = 5000
# Sử dụng múi giờ địa phương cho định dạng %Y/%m/%d
csvAgent.sinks.snk_hdfs_csv.hdfs.useLocalTimeStamp = false

# ------------------------------------------------------------------------------
# 4. KẾT NỐI SOURCE VÀ SINK VỚI CHANNEL
# ------------------------------------------------------------------------------
csvAgent.sources.src_spool_csv.channels = ch_file_csv
csvAgent.sinks.snk_hdfs_csv.channel = ch_file_csv
