# ==============================================================================
# KỊCH BẢN 2: THU NHẬN SỰ KIỆN LUỒNG NETWORK_KPI_EVENT TỪ KAFKA/NETCAT VÀO HBASE VÀ HDFS
# Mục đích: Nhận các event đo kiểm độ trễ, mất gói, rớt cuộc gọi thời gian thực,
#           ghi đồng thời vào HBase (truy cập ngẫu nhiên tức thời) và HDFS (lưu trữ lâu dài).
# Kiến trúc: 1 Source -> Fan-out sang 2 Channels -> 2 Sinks (HBase & HDFS)
# ==============================================================================

# Định nghĩa Agent luồng sự kiện
streamAgent.sources = src_kafka_events
streamAgent.channels = ch_hbase_file ch_hdfs_mem
streamAgent.sinks = snk_hbase_kpi snk_hdfs_raw

# ------------------------------------------------------------------------------
# 1. CẤU HÌNH SOURCE (Kafka Source - Thu nhận luồng sự kiện mạng từ message broker)
# ------------------------------------------------------------------------------
streamAgent.sources.src_kafka_events.type = org.apache.flume.source.kafka.KafkaSource
streamAgent.sources.src_kafka_events.kafka.bootstrap.servers = masternode:9092,datanode1:9092,datanode2:9092
streamAgent.sources.src_kafka_events.kafka.topics = telecom_network_kpi_events
streamAgent.sources.src_kafka_events.kafka.consumer.group.id = flume_kpi_consumer_grp
streamAgent.sources.src_kafka_events.batchSize = 2000
streamAgent.sources.src_kafka_events.batchDurationMillis = 1000

# Interceptor gắn timestamp và header
streamAgent.sources.src_kafka_events.interceptors = it_ts
streamAgent.sources.src_kafka_events.interceptors.it_ts.type = timestamp

# (Tùy chọn: Dự phòng cổng Netcat để tiếp nhận trực tiếp từ trạm kiểm thử)
# streamAgent.sources.src_netcat.type = netcat
# streamAgent.sources.src_netcat.bind = 0.0.0.0
# streamAgent.sources.src_netcat.port = 8888

# ------------------------------------------------------------------------------
# 2. CẤU HÌNH CHANNELS (Dual Channel: 1 FileChannel bảo toàn cao, 1 MemoryChannel tốc độ)
# ------------------------------------------------------------------------------
# Channel A: FileChannel dành riêng cho HBase (Đòi hỏi độ bền bỉ, không thể mất mát cảnh báo KPI)
streamAgent.channels.ch_hbase_file.type = file
streamAgent.channels.ch_hbase_file.checkpointDir = /var/flume/checkpoint/hbase_stream
streamAgent.channels.ch_hbase_file.dataDirs = /var/flume/data/hbase_stream
streamAgent.channels.ch_hbase_file.capacity = 500000
streamAgent.channels.ch_hbase_file.transactionCapacity = 5000

# Channel B: MemoryChannel dành cho HDFS (Tối ưu thông lượng streaming nạp thẳng HDFS)
streamAgent.channels.ch_hdfs_mem.type = memory
streamAgent.channels.ch_hdfs_mem.capacity = 100000
streamAgent.channels.ch_hdfs_mem.transactionCapacity = 10000

# ------------------------------------------------------------------------------
# 3. CẤU HÌNH SINK 1: AsyncHBaseSink (Ghi thời gian thực vào bảng HBase telecom_kpi)
# ------------------------------------------------------------------------------
streamAgent.sinks.snk_hbase_kpi.type = asynchbase
streamAgent.sinks.snk_hbase_kpi.table = telecom_kpi
streamAgent.sinks.snk_hbase_kpi.columnFamily = cf_kpi
streamAgent.sinks.snk_hbase_kpi.zookeeperQuorum = masternode,datanode1,datanode2
streamAgent.sinks.snk_hbase_kpi.znodeParent = /hbase
# Bộ serializer chuyển đổi chuỗi JSON/CSV event thành RowKey và Columns của HBase
streamAgent.sinks.snk_hbase_kpi.serializer = org.apache.flume.sink.hbase.SimpleAsyncHbaseEventSerializer
streamAgent.sinks.snk_hbase_kpi.serializer.payloadColumn = raw_payload
streamAgent.sinks.snk_hbase_kpi.serializer.incrementColumn = event_count
streamAgent.sinks.snk_hbase_kpi.batchSize = 2000

# ------------------------------------------------------------------------------
# 4. CẤU HÌNH SINK 2: HDFS Sink (Lưu trữ toàn bộ luồng sự kiện thô)
# ------------------------------------------------------------------------------
streamAgent.sinks.snk_hdfs_raw.type = hdfs
streamAgent.sinks.snk_hdfs_raw.hdfs.path = hdfs://masternode:9000/telecom/raw/events/%Y/%m/%d/%H
streamAgent.sinks.snk_hdfs_raw.hdfs.filePrefix = kpi_stream
streamAgent.sinks.snk_hdfs_raw.hdfs.fileSuffix = .log
streamAgent.sinks.snk_hdfs_raw.hdfs.fileType = DataStream
streamAgent.sinks.snk_hdfs_raw.hdfs.rollInterval = 60
streamAgent.sinks.snk_hdfs_raw.hdfs.rollSize = 67108864
streamAgent.sinks.snk_hdfs_raw.hdfs.rollCount = 0
streamAgent.sinks.snk_hdfs_raw.hdfs.batchSize = 2000

# ------------------------------------------------------------------------------
# 5. KẾT NỐI SOURCE VỚI 2 CHANNELS (Multiplexing / Replicating)
# ------------------------------------------------------------------------------
streamAgent.sources.src_kafka_events.channels = ch_hbase_file ch_hdfs_mem
streamAgent.sinks.snk_hbase_kpi.channel = ch_hbase_file
streamAgent.sinks.snk_hdfs_raw.channel = ch_hdfs_mem
